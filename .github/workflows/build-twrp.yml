name: Build TWRP for nevada

on:
  workflow_dispatch:

jobs:
  build-twrp:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean
        df -h

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq git-core gnupg flex bison build-essential \
          zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
          libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev \
          lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
          python3 openjdk-11-jdk

    - name: Setup repo
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Init TWRP minimal manifest
      run: |
        mkdir twrp
        cd twrp
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1

    - name: Sync sources (shallow)
      working-directory: twrp
      run: |
        repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune

    - name: Clone device tree
      working-directory: twrp
      run: |
        git clone --depth=1 https://github.com/crabcakes97/android_device_motorola_nevada.git device/motorola/nevada

    - name: Clean stale recovery output
      working-directory: twrp
      run: rm -rf out/target/product/nevada/recovery/root/vendor

    - name: Build TWRP
      working-directory: twrp
      run: |
        export SOONG_ALLOW_MISSING_DEPENDENCIES=true
        export BUILD_FUZZER=false
        export WITH_VTS=false
        source build/envsetup.sh
        lunch twrp_nevada-eng
        mka bootimage vendorbootimage -j$(nproc)

    - name: Upload TWRP
      uses: actions/upload-artifact@v4
      with:
        name: twrp-nevada
        path: |
          twrp/out/target/product/nevada/boot.img
          twrp/out/target/product/nevada/vendor_boot.img
        retention-days: 5
